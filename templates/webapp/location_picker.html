<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Joylashuvni tanlang</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 96px;
            left: 0;
            right: 0;
        }
        #panel {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px 16px;
            background: var(--tg-theme-bg-color, #fff);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            height: 96px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #coords {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #666);
            text-align: center;
            min-height: 16px;
        }
        #send-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            cursor: pointer;
        }
        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .locate-btn {
            position: absolute;
            right: 12px;
            bottom: 108px;
            width: 44px;
            height: 44px;
            border-radius: 22px;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.15);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            font-size: 20px;
            cursor: pointer;
            z-index: 500;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <button class="locate-btn" id="locate-btn" title="Mening joylashuvim">📍</button>
    <div id="panel">
        <div id="coords">Xaritadan nuqtani tanlang</div>
        <button id="send-btn" disabled>✅ Tanlash</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const defaultCenter = [41.3111, 69.2797];
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false,
        }).setView(defaultCenter, 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        let marker = null;
        let selected = null;

        const coordsEl = document.getElementById('coords');
        const sendBtn = document.getElementById('send-btn');
        const locateBtn = document.getElementById('locate-btn');

        function setPoint(latlng) {
            selected = { lat: latlng.lat, lon: latlng.lng };
            if (marker) {
                marker.setLatLng(latlng);
            } else {
                marker = L.marker(latlng, { draggable: true }).addTo(map);
                marker.on('dragend', (e) => setPoint(e.target.getLatLng()));
            }
            coordsEl.textContent = `📍 ${selected.lat.toFixed(6)}, ${selected.lon.toFixed(6)}`;
            sendBtn.disabled = false;
        }

        map.on('click', (e) => setPoint(e.latlng));

        locateBtn.addEventListener('click', () => {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
                    map.setView(ll, 16);
                    setPoint(ll);
                },
                () => {},
                { enableHighAccuracy: true, timeout: 8000 }
            );
        });

        sendBtn.addEventListener('click', () => {
            if (!selected) return;
            const payload = JSON.stringify({
                lat: Number(selected.lat.toFixed(6)),
                lon: Number(selected.lon.toFixed(6)),
            });
            if (tg && typeof tg.sendData === 'function') {
                tg.sendData(payload);
                tg.close();
            } else {
                alert('Bu sahifa Telegram ichida ochilishi kerak.');
            }
        });

        if (tg && tg.colorScheme === 'dark') {
            document.body.style.background = '#1c1c1d';
        }
    </script>
</body>
</html>
